[project]
name = "marginalia"
version = "1.1.2"
description = "Your reMarkable as an AI agent front end: pen marks in, structured results out (MCP server)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Sven Eliasson" },
    { name = "Sam Morrow", email = "sammorrowdrums@users.noreply.github.com" },
]
keywords = ["mcp", "remarkable", "tablet", "handwriting", "pen", "review", "agents", "e-ink"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "rmscene>=0.8.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "requests>=2.28.0",
    "pymupdf>=1.26.7",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=4.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
ocr = [
    "google-cloud-vision>=3.0.0",
]
web = [
    "trafilatura>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/comino/marginalia"
Documentation = "https://github.com/comino/marginalia/blob/main/docs/workflows.md"
Issues = "https://github.com/comino/marginalia/issues"

[project.scripts]
marginalia = "remarkable_mcp.cli:main"
marginalia-autopilot = "remarkable_mcp.workflows.autopilot:main"
# Original names, kept so existing configs and service files keep working.
remarkable-mcp = "remarkable_mcp.cli:main"
remarkable-autopilot = "remarkable_mcp.workflows.autopilot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remarkable_mcp"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
# tests/ import shared helpers from each other (test_workflows, test_sketch, ...)
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Ported verbatim from trmnl-mcp (written for a longer line limit).
"remarkable_mcp/trmnl/*" = ["E501"]
# Tests carry long literal fixtures (strokes, payloads); keep them readable on one line.
"tests/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
]
